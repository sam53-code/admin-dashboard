<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/root.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
  </head>

  <body>
    <div class="dashboard-container">
      <aside class="sidebar">
        <div class="logo">
          <a href=""
            ><img src="assets/icons/dashboard.svg" alt="company logo" />
            <span>Dashboard</span></a
          >
        </div>

        <nav class="sidebar-navigation">
          <ul>
            <li>
              <a href="#home"
                ><img src="assets/icons/home.svg" alt="" /> <span>Home</span></a
              >
            </li>

            <li>
              <a href="#profile"
                ><img src="assets/icons/profile.svg" alt="" /><span
                  >Profile</span
                ></a
              >
            </li>

            <li>
              <a href="#message"
                ><img src="assets/icons/message.svg" alt="" /><span
                  >Message</span
                ></a
              >
            </li>

            <li>
              <a href="#history"
                ><img src="assets/icons/history.svg" alt="" /><span
                  >History</span
                ></a
              >
            </li>

            <li>
              <a href="#task"
                ><img src="assets/icons/task.svg" alt="" /><span>Task</span></a
              >
            </li>

            <li>
              <a href="#community"
                ><img src="assets/icons/community.svg" alt="" /><span
                  >Community</span
                ></a
              >
            </li>
          </ul>
        </nav>

        <div class="help-nav">
          <ul>
            <li>
              <a href="#privacy">
                <img src="assets/icons/privacy.svg" alt="" /><span
                  >Privacy</span
                ></a
              >
            </li>

            <li>
              <a href="#support"
                ><img src="assets/icons/support.svg" alt="" /><span
                  >Support</span
                ></a
              >
            </li>

            <li>
              <a href="#privacy"
                ><img src="assets/icons/settings.svg" alt="" /><span
                  >privacy</span
                ></a
              >
            </li>
          </ul>
        </div>
      </aside>

      <div class="main-content">
        <header class="site-header">
          <div class="search-bar header-content">
            <input
              type="search"
              name="searchbar"
              id="searchbar"
              placeholder="search"
            />
            <label for="searchbar"><span>Search</span></label>
          </div>

          <div class="user-info header-content">
            <img
              class="icons"
              src="assets/icons/notification.svg"
              alt="Notification icon"
            />
            <img
              class="profile-pic"
              src="assets/img/profile-pic.jpg"
              alt="Admin profile picture"
            />
            <p>Samson Mphande</p>
          </div>

          <div class="admin-profile header-content">
            <img
              class="main-profile-pic"
              src="assets/img/profile-pic.jpg"
              alt="Admin profile picture"
            />
            <p>Welcome Back!<span>Samson Mphande (@samson)</span></p>
          </div>

          <div class="btn header-content">
            <button type="button">New</button>
            <button type="button">Upload</button>
            <button type="button">Share</button>
          </div>
        </header>

        <main class="dashboard-main">
          <section class="dashboard-grid">
            <h1>Dashboard</h1>
          </section>

          <aside class="dashboard-sidebar">
            <section class="announcement-section">
              <h2>Announcements</h2>
            </section>

            <section class="trending-section">
              <h2>Trending</h2>
            </section>
          </aside>
        </main>

        <footer class="site-footer"></footer>
      </div>
    </div>
  </body>
</html>
